name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # There was none. The package shipped a theme every Kyron surface is drawn
  # from, and nothing checked it -- which is how a FloatingActionButton went
  # out as a white glyph on a near-white disc, measured at 1.06:1, and stayed
  # that way until somebody looked at their phone and said so.
  flutter:
    name: The theme builds and stays legible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --reporter=expanded
